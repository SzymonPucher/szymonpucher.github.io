name: Deploy Dev to GitHub Pages

on:
  push:
    branches:
      - 'epic/**'
      - 'epic*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build site for Dev
        env:
          ASTRO_BASE: '/szymonpucher-dev/'
          ASTRO_SITE: 'https://szymonpucher.github.io'
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID || '869604397100-4c37t9il1hub0ke4p0on2hhlsbhbgj9i.apps.googleusercontent.com' }}
        run: npm run build

      - name: Deploy to szymonpucher-dev repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEV_REPO_DEPLOY_KEY }}
          external_repository: SzymonPucher/szymonpucher-dev
          publish_branch: main
          publish_dir: ./dist
